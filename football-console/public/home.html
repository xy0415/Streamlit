<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="FXI 足球賽程、賽前分析、賽後復盤、歷史統計與聯賽積分榜。">
  <title>FXI｜足球賽程與分析</title>
  <link rel="icon" href="/fxi.svg" type="image/svg+xml">
  <link rel="preload" href="/fxi-display.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/home.css">
  <script src="/home.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至首頁內容</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="/" aria-label="FXI 首頁">
        <span class="brand-word">FX<span>I</span></span>
      </a>
      <nav class="navigation" aria-label="網站導覽">
        <a href="/" aria-current="page">首頁</a>
        <a href="/analysis.html#schedule">每日賽程</a>
        <a href="/analysis.html#predictions">分析預測</a>
        <a href="/analysis.html#reviews">賽後復盤</a>
        <a href="/analysis.html#history">歷史統計</a>
        <a href="/analysis.html#standings">聯賽積分榜</a>
        <a href="/index.html">資料驗證</a>
      </nav>
      <div class="rail-date">
        <span class="label">台灣日期</span>
        <time id="taiwan-date"></time>
      </div>
    </aside>
    <main id="main">
      <section class="hero" aria-labelledby="headline">
        <canvas class="hero-art" aria-hidden="true"></canvas>
        <div class="hero-top">
          <span class="label">FOOTBALL INTELLIGENCE</span>
          <button class="motion" type="button" aria-pressed="true" hidden>停用動態</button>
        </div>
        <div class="hero-copy">
          <h1 class="headline" id="headline" lang="en"><span>READ</span> <span>THE</span> <span>GAME.</span></h1>
          <p>足球賽程、賽前分析與賽後復盤。</p>
          <div class="hero-actions">
            <a href="/analysis.html#schedule">查看每日賽程</a>
            <a href="/analysis.html#predictions">閱讀正式預測</a>
          </div>
        </div>
      </section>
      <section class="overview" aria-label="足球資料總覽">
        <article class="report-tile">
          <h2 class="label">最新正式預測</h2>
          <p class="tile-title" id="report-date">讀取中</p>
          <p id="report-summary">正在讀取正式預測紀錄。</p>
          <a class="text-link" id="report-link" href="/analysis.html#predictions">查看預測</a>
        </article>
        <article class="tile review-tile">
          <h2 class="label">賽後復盤</h2>
          <p>核對原始預測與完場比分。</p>
          <a class="text-link" href="/analysis.html#reviews">查看復盤</a>
        </article>
        <article class="tile">
          <h2 class="label">歷史統計</h2>
          <p>按期間查看結算與各聯賽命中率。</p>
          <a class="text-link" href="/analysis.html#history">查看統計</a>
        </article>
        <article class="tile">
          <h2 class="label">聯賽積分榜</h2>
          <p>查詢排名、積分與淨勝球。</p>
          <a class="text-link" href="/analysis.html#standings">查看積分榜</a>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
