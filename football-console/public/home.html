<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="FXI 足球賽程、賽前分析、賽後復盤、歷史統計與聯賽積分榜。">
  <title>FXI｜足球賽程與分析</title>
  <link rel="icon" href="/favicon.ico?v=d" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/fxi.svg?v=d" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/fxi-touch.png">
  <link rel="stylesheet" href="/vendor/editorial-tokens.css">
  <link rel="stylesheet" href="/fxi-brand.css">
  <link rel="preload" href="/fxi-display.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/home.css">
  <script src="/vendor/anime-3.2.2.min.js" defer></script>
  <script src="/prediction-insights.js" defer></script>
<script src="/home.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至首頁內容</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="/" aria-label="FXI 首頁">
        <img class="fxi-mark fxi-mark-home" src="/fxi-mark.svg" width="88" height="49" alt="">
      </a>
      <nav class="navigation" aria-label="網站導覽">
        <a href="/" aria-current="page">首頁</a>
        <a href="/analysis.html#schedule">每日賽程</a>
        <a href="/analysis.html#predictions">預測分析</a>
        <a href="/analysis.html#reviews">賽後復盤</a>
        <a href="/analysis.html#history">歷史統計</a>
        <a href="/analysis.html#standings">聯賽積分榜</a>
        <a href="/analysis.html?search=1#predictions">搜尋</a>
        <a href="/index.html">資料驗證</a>
      </nav>
      <div class="rail-date">
        <span class="label">台灣日期</span>
        <time id="taiwan-date"></time>
      </div>
    </aside>
    <main id="main">
      <section class="hero" aria-labelledby="headline">
        <canvas class="hero-art" aria-hidden="true"></canvas>
        <div class="hero-top">
          <span class="label">FOOTBALL INTELLIGENCE</span>
          <button class="motion" type="button" aria-pressed="true" hidden>停用動態</button>
        </div>
        <div class="hero-copy">
          <h1 class="headline" id="headline" lang="en"><span>BET</span> <span>WITH</span> <span>INSIGHT.</span></h1>
          <p>足球賽程、賽前分析與賽後復盤。</p>
          <div class="hero-actions">
            <a href="/analysis.html#schedule">查看每日賽程</a>
            <a href="/analysis.html#predictions">查看預測分析</a>
          </div>
        </div>
      </section>
      <section class="overview" aria-label="足球資料總覽">
        <article class="report-tile">
          <h2 class="label">最新預測分析</h2>
          <p class="tile-title" id="report-date">讀取中</p>
          <p id="report-summary" role="status">正在讀取正式預測紀錄。</p>
          <p id="report-release" class="tile-meta" hidden></p>
          <a class="text-link" id="report-link" href="/analysis.html#predictions">查看預測分析</a>
        </article>
        <article class="tile review-tile">
          <h2 class="label">重點賽事</h2>
          <p id="featured-match">正在讀取賽事</p>
          <p id="featured-time" class="tile-meta" hidden></p>
          <a class="text-link" id="featured-link" href="/analysis.html#schedule">查看賽程</a>
        </article>
        <article class="tile">
          <h2 class="label">最新賽後復盤</h2>
          <p id="recap-match">正在查核完場比分</p>
          <p id="recap-time" class="tile-meta" hidden></p>
          <a class="text-link" id="recap-link" href="/analysis.html#reviews">查看復盤</a>
        </article>
        <article class="tile">
          <h2 class="label">歷史統計</h2>
          <p>按期間、聯賽與玩法查看命中率。</p>
          <a class="text-link" href="/analysis.html#history">查看統計</a>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
