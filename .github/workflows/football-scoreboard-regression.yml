name: Football scoreboard regression

on:
  push:
    branches:
      - football-fixture-console
    paths:
      - 'football-console/**'
      - '.github/workflows/football-scoreboard-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate service and dashboard syntax
        run: |
          node --check football-console/server.js
          node --check football-console/api-football.js
          node --check football-console/public/analysis.js
          node --check football-console/public/app.js
      - name: Run match-status regression tests
        run: node --test football-console/tests/*.test.js
